<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cita al cine</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="./images/icon-spiderman.ico" type="image/png">
</head>
<body>

    <div class="hoja-cuaderno">
        <!-- El atributo contenteditable="true" permite escribir en la hoja desde el navegador -->
        <div class="cuadricula">
            <section class="image-left">
                <img src="./images/1.png" alt="Spider_Man_B&W" width="100%">
                <img src="./images/2.png" alt="Spider_Man_Small">
            </section>
            <section class="form-center">
                <h1>Spider-Man: brand new day</h1>
                <h2>Escribe tu segundo nombre</h2>
                <input id="palabraInput" type="text" placeholder="Escribe tu segundo nombre" maxlength="20">
                <button id="validarBtn" type="button">Validar</button>

                <div id="mensajeValidacion" class="mensaje-validacion" hidden>
                    <p id="textoValidacion"> Solo contigo quiero ir.</p>
                    <div id="botonesRespuesta" class="botones" hidden>
                        <button type="button" class="btn-aceptar">Sí, quiero ir contigo</button>
                        <button type="button" class="btn-cancelar">No, gracias</button>
                    </div>
                </div>
            </section>
            <section class="image-right">
            <img src="./images/3.png" alt="Spider_Man_Acuarela" width="50%">
            <img src="./images/4.png" alt="Spider_Man_Full" width="80%">
            </section>
        </div>
    </div>

    <script>
        const palabraInput = document.getElementById('palabraInput');
        const validarBtn = document.getElementById('validarBtn');
        const mensajeValidacion = document.getElementById('mensajeValidacion');
        const textoValidacion = document.getElementById('textoValidacion');
        const botonesRespuesta = document.getElementById('botonesRespuesta');

        function validarPalabra() {
            const valor = palabraInput.value.trim();

            if (valor === 'Camila') {
                mensajeValidacion.hidden = false;
                botonesRespuesta.hidden = false;
                textoValidacion.textContent = 'Siempre fuiste tú.';
            } else {
                mensajeValidacion.hidden = true;
                botonesRespuesta.hidden = true;
                textoValidacion.textContent = '';
                alert('Intenta colocando la primer letra en mayuscula.');
            }
        }

        validarBtn.addEventListener('click', validarPalabra);
        palabraInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                validarPalabra();
            }
        });
    </script>

</body>
</html>
